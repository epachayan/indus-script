name: pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 tests/test_parse_mackay.py
      - run: ./setup.sh
      # CDLI steps are skipped automatically (the 87 MB file is not fetched in CI)
      - run: ./run_all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: logs-and-tables
          path: |
            work/logs/
            outputs/*.csv
